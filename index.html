<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <!-- スマートフォンで画面幅に合わせて表示するための設定 -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>レシピ検索システム</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header class="header">
    <h1>レシピ検索システム</h1>
  </header>

  <!-- ==================== G-01 メイン画面 ==================== -->
  <main id="mainScreen" class="main">

    <!-- 左側：食材エリア -->
    <div class="food-column">

      <!-- カート内商品 -->
      <section class="food-area area-cart">
        <h2>カート内商品</h2>
        <div class="input-row">
          <select id="cartSelect"></select>
          <button id="cartAddBtn" type="button">追加</button>
        </div>
        <ul id="cartList" class="food-list"></ul>
        <p class="hint">※ダブルクリックで削除</p>
      </section>

      <div class="food-row">
        <!-- カート外食材（家にある食材） -->
        <section class="food-area area-home">
          <h2>カート外食材<span class="sub">（家にある食材）</span></h2>
          <div class="input-row">
            <select id="homeSelect"></select>
            <button id="homeAddBtn" type="button">追加</button>
          </div>
          <ul id="homeList" class="food-list"></ul>
          <p class="hint">※ダブルクリックで削除</p>
        </section>

        <!-- 対象外食材 -->
        <section class="food-area area-exclude">
          <h2>対象外食材</h2>
          <div class="input-row">
            <select id="excludeSelect"></select>
            <button id="excludeAddBtn" type="button">追加</button>
          </div>
          <ul id="excludeList" class="food-list"></ul>
          <p class="hint">※ダブルクリックで削除</p>
        </section>
      </div>
    </div>

    <!-- 右側：レシピ一覧 -->
    <section class="recipe-area">
      <div class="recipe-head">
        <h2>レシピ一覧</h2>
        <button id="searchBtn" type="button" class="search-btn">レシピを探す</button>
      </div>
      <p id="message" class="message">食材を追加して「レシピを探す」を押してください。</p>
      <table id="recipeTable" class="recipe-table">
        <thead>
          <tr>
            <th class="col-no">No.</th>
            <th class="col-img">画像</th>
            <th>レシピ名</th>
            <th class="col-match">一致</th>
          </tr>
        </thead>
        <tbody id="recipeBody"></tbody>
      </table>
      <p class="hint">※レシピをダブルクリックで詳細を表示</p>
    </section>

  </main>

  <!-- ==================== G-02 レシピ詳細画面 ==================== -->
  <section id="detailScreen" class="detail hidden">
    <button id="backBtn" type="button" class="back-btn">← 戻る</button>
    <h2 id="detailName"></h2>

    <div class="detail-top">
      <img id="detailImage" class="detail-image" src="" alt="">
      <div class="detail-info">
        <p>調理時間：<span id="detailTime"></span></p>
        <p>一致：<span id="detailMatch"></span></p>
        <p id="detailDescription" class="description"></p>
      </div>
    </div>

    <h3>材料<span id="detailServings"></span></h3>
    <ul id="detailFoods" class="detail-foods"></ul>
  </section>

  <!-- データは api フォルダのPHPからデータベースを読んで受け取る -->
  <script src="js/main.js"></script>
</body>
</html>
